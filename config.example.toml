# پروزه اتوماسیون بورسی
# Copy to config.local.toml; local settings are never committed.
[device]
name = "personal-device"

[server]
host = "127.0.0.1"
port = 8765

[paths]
data = "data"
reports = "reports"
logs = "logs"
sessions = "sessions"

[market]
# Only these public market-data hosts may be accepted by the local analysis endpoint.
approved_hosts = ["tsetmc.com", "www.tsetmc.com"]

[fundamental]
# Only official disclosure hosts may be accepted by the local fundamental endpoint.
approved_hosts = ["codal.ir", "www.codal.ir"]

[brokerage]
# Add only the user's brokerage host in config.local.toml; leave empty in Git.
approved_hosts = []
